<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Viongame</title>
    <link rel="stylesheet" href="../../shared/game-style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="game-page">
    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <div class="stats-board">
                <div class="stat-item">Moves: <span id="moves">0</span></div>
                <div class="stat-item">Time: <span id="time">00:00</span></div>
                <div class="stat-item">Best: <span id="best-moves">-</span></div>
            </div>
        </div>

        <div class="memory-grid" id="memoryGrid">
            <!-- Cards will be generated here -->
        </div>

        <div class="controls-info">
            <p>Click cards to flip and find pairs</p>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2>YOU WON!</h2>
            <p>Moves: <span id="finalMoves">0</span></p>
            <p>Time: <span id="finalTime">00:00</span></p>
            <button id="restartBtn" class="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="../../shared/game-utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
