<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Viongame</title>
    <link rel="stylesheet" href="../../shared/game-style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="game-page">
    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <div class="score-board">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="score-box">Best: <span id="high-score">0</span></div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Grid cells will be generated here -->
        </div>

        <div class="controls-info">
            <p>Desktop: Arrow Keys to Slide</p>
            <p>Mobile: Swipe to Slide</p>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2 id="gameOverTitle">GAME OVER</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">Try Again</button>
        </div>
    </div>

    <script src="../../shared/game-utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
