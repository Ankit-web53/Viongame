<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker - Viongame</title>
    <link rel="stylesheet" href="../../shared/game-style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="game-page">
    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <div class="score-board">Score: <span id="score">0</span> | High: <span id="high-score">0</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div class="controls-info">
            <p>Desktop: Arrow Left/Right or A/D to Move</p>
            <p>Mobile: Tap/Swipe Left/Right</p>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2 id="gameOverTitle">GAME OVER</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">Play Again</button>
        </div>
    </div>

    <!-- Mobile Controls Overlay -->
    <div class="mobile-controls">
        <div class="control-btn" id="btn-left"><i class="fas fa-chevron-left"></i></div>
        <div class="control-btn" id="btn-right"><i class="fas fa-chevron-right"></i></div>
    </div>

    <script src="../../shared/game-utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
